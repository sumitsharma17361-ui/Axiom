<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>AXIOM</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ AUTH SCREEN ============ -->
<div id="authScreen" class="screen active">
  <div class="auth-card">
    <div class="logo-wrap">
      <div class="logo-mark">A</div>
      <h1 class="logo-text">AXIOM</h1>
      <p class="tagline">Your personal intelligence</p>
    </div>

    <div id="authError" class="auth-error"></div>

    <div class="input-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email" autocapitalize="off">
    </div>
    <div class="input-group" id="nameGroup" style="display:none;">
      <label>Name</label>
      <input type="text" id="name" placeholder="Your name" autocomplete="name">
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Min 6 characters" autocomplete="current-password">
    </div>

    <button id="primaryBtn" class="btn primary" onclick="login()">Sign In</button>
    <button id="secondaryBtn" class="btn ghost" onclick="toggleMode()">New here? Create account</button>
  </div>
</div>

<!-- ============ CHAT SCREEN ============ -->
<div id="chatScreen" class="screen">
  <header class="topbar">
    <div class="brand">
      <div class="brand-dot"></div>
      <span>AXIOM</span>
    </div>
    <div class="top-actions">
      <button id="voiceOutBtn" class="icon-btn" title="Voice output" onclick="toggleVoiceOutput()">🔊</button>
      <button class="icon-btn" onclick="openMenu()">☰</button>
    </div>
  </header>

  <main id="messages" class="messages">
    <div class="welcome">
      <div class="welcome-icon">◈</div>
      <h2>Good to see you, <span id="welcomeName">User</span></h2>
      <p>Ask me anything. I can search, calculate, check weather, remember facts.</p>
      <div class="suggestions">
        <button onclick="quickAsk('What is the weather in Delhi?')">🌤 Weather</button>
        <button onclick="quickAsk('Remember my birthday is 15 August 2004')">🧠 Remember</button>
        <button onclick="quickAsk('What is 156 × 23 + 45?')">🧮 Calculate</button>
        <button onclick="quickAsk('Latest AI news')">🔍 Search</button>
      </div>
    </div>
  </main>

  <div id="listeningBar" class="listening-bar hidden">
    <div class="wave">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <span>Listening…</span>
  </div>

  <footer class="composer">
    <button id="micBtn" class="icon-btn mic" onclick="toggleMic()" title="Voice input">🎤</button>
    <textarea id="input" placeholder="Message AXIOM…" rows="1" onkeydown="handleKey(event)" oninput="autosize(this)"></textarea>
    <button id="sendBtn" class="send-btn" onclick="sendMessage()" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 2L11 13"/>
        <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
      </svg>
    </button>
  </footer>
</div>

<!-- ============ MENU DRAWER ============ -->
<div id="menuDrawer" class="menu-drawer">
  <div class="menu-head">
    <div class="menu-avatar" id="menuAvatar">U</div>
    <div>
      <div class="menu-name" id="menuName">User</div>
      <div class="menu-email" id="menuEmail">user@axiom.ai</div>
    </div>
  </div>
  <button class="menu-item" onclick="showMemories()">🧠 Memories</button>
  <button class="menu-item" onclick="clearChat()">🗑 Clear conversation</button>
  <button class="menu-item danger" onclick="logout()">🚪 Sign out</button>
  <div class="menu-footer">AXIOM v1.0 · Built by you</div>
</div>
<div id="menuBackdrop" class="backdrop" onclick="closeMenu()"></div>

<!-- ============ MEMORIES MODAL ============ -->
<div id="memoryModal" class="modal-backdrop">
  <div class="modal">
    <div class="modal-head">
      <h3>🧠 Memories</h3>
      <button class="icon-btn" onclick="closeMemories()">✕</button>
    </div>
    <div id="memoryList" class="modal-body"><div class="empty">Loading…</div></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
