<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050914">
<title>AXIOM | Voice Assistant</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-glow glow-1"></div>
<div class="bg-glow glow-2"></div>

<!-- AUTH -->
<div id="authScreen" class="screen active">
  <div class="auth-card glass-panel">
    <div class="logo-wrap">
      <div class="logo-mark">A</div>
      <h1 class="logo-text">AXIOM</h1>
      <p class="tagline">Your personal intelligence</p>
    </div>
    <div id="authError" class="auth-error"></div>
    <div class="input-group"><label>Email</label><input type="email" id="email" placeholder="you@example.com"></div>
    <div class="input-group" id="nameGroup" style="display:none;"><label>Name</label><input type="text" id="name" placeholder="Your name"></div>
    <div class="input-group"><label>Password</label><input type="password" id="password" placeholder="Min 6 characters"></div>
    <button id="primaryBtn" class="btn primary" onclick="submitAuth()">Sign In</button>
    <button id="secondaryBtn" class="btn ghost" onclick="toggleMode()">New here? Create account</button>
  </div>
</div>

<!-- START SCREEN -->
<div id="startScreen" class="screen">
  <div class="start-container">
    <div class="orb-container"><div class="orb-core"></div><div class="orb-ring"></div></div>
    <h1 class="start-title">AXIOM</h1>
    <p class="start-subtitle" id="startGreeting">Ready.</p>
    <button class="btn start-btn" onclick="startLiveMode()">Tap to Start</button>
  </div>
</div>

<!-- CHAT / LIVE SCREEN -->
<div id="chatScreen" class="screen">
  <header class="topbar glass-panel">
    <div class="brand"><div class="brand-dot"></div><span>AXIOM LIVE</span></div>
    <div class="top-actions"><button class="icon-btn" onclick="stopLiveMode()" title="Stop">✕</button></div>
  </header>

  <main id="messages" class="messages"></main>

  <!-- Voice Visualizer -->
  <div class="visualizer" id="voiceVisualizer">
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
  </div>

  <footer class="composer glass-panel" style="flex-direction: column; gap: 10px; padding: 16px;">
    <div id="statusText" style="text-align: center; font-size: 13px; font-weight: bold; color: var(--accent);">Wait...</div>
    
    <!-- Bada Mic Button -->
    <button id="micButton" onclick="toggleMic()" style="width: 70px; height: 70px; border-radius: 50%; background: var(--accent-gradient); border: none; display: flex; align-items: center; justify-content: center; margin: 0 auto; box-shadow: 0 0 20px var(--accent-glow); cursor: pointer;">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" style="width: 30px; height: 30px;"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
    </button>
  </footer>
</div>

<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
