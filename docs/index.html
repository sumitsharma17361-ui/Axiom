<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050914">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AXIOM | Voice Assistant</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-glow glow-1"></div>
<div class="bg-glow glow-2"></div>

<!-- ============ AUTH SCREEN ============ -->
<div id="authScreen" class="screen active">
  <div class="auth-card glass-panel">
    <div class="logo-wrap">
      <div class="logo-mark">A</div>
      <h1 class="logo-text">AXIOM</h1>
      <p class="tagline">Your personal intelligence</p>
    </div>
    <div id="authError" class="auth-error"></div>
    <div class="input-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" autocapitalize="off">
    </div>
    <div class="input-group" id="nameGroup" style="display:none;">
      <label>Name</label>
      <input type="text" id="name" placeholder="Your name">
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Min 6 characters">
    </div>
    <button id="primaryBtn" class="btn primary" onclick="submitAuth()">Sign In</button>
    <button id="secondaryBtn" class="btn ghost" onclick="toggleMode()">New here? Create account</button>
  </div>
</div>

<!-- ============ START SCREEN (JARVIS MODE) ============ -->
<div id="startScreen" class="screen">
  <div class="start-container">
    <div class="orb-container" id="mainOrb">
      <div class="orb-core"></div>
      <div class="orb-ring"></div>
    </div>
    <h1 class="start-title">AXIOM</h1>
    <p class="start-subtitle" id="startGreeting">Ready when you are, Sumit.</p>
    <button class="btn start-btn" onclick="startLiveMode()">Tap to Start</button>
  </div>
</div>

<!-- ============ CHAT SCREEN ============ -->
<div id="chatScreen" class="screen">
  <header class="topbar glass-panel">
    <div class="brand">
      <div class="brand-dot"></div>
      <span>AXIOM LIVE</span>
    </div>
    <div class="top-actions">
      <button class="icon-btn" onclick="stopLiveMode()" title="Stop">✕</button>
    </div>
  </header>

  <main id="messages" class="messages">
    <!-- Messages will appear here -->
  </main>

  <!-- Voice Visualizer -->
  <div class="visualizer" id="voiceVisualizer">
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
  </div>

  <footer class="composer glass-panel" style="flex-direction: column;">
    <div id="statusText" style="text-align: center; font-size: 12px; color: var(--text-dim); margin-bottom: 8px;">Tap the mic or just speak...</div>
    
    <!-- Text input kept as fallback -->
    <div style="display: flex; width: 100%; gap: 10px;">
      <input type="text" id="input" placeholder="Type if needed..." style="flex: 1; padding: 12px; border-radius: 20px; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); color: white;" onkeydown="handleKey(event)">
      <button class="send-btn" onclick="handleManualText()" style="width: 45px; height: 45px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </div>
  </footer>
</div>

<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
