<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050914">
<title>AXIOM | Pro Chat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-glow glow-1"></div>
<div class="bg-glow glow-2"></div>

<!-- AUTH SCREEN -->
<div id="authScreen" class="screen active">
  <div class="auth-card glass-panel">
    <div class="logo-wrap">
      <div class="logo-mark">A</div>
      <h1 class="logo-text">AXIOM</h1>
      <p class="tagline">Pro AI Assistant</p>
    </div>
    <div id="authError" class="auth-error"></div>
    <div class="input-group"><label>Email</label><input type="email" id="email" placeholder="you@example.com"></div>
    <div class="input-group" id="nameGroup" style="display:none;"><label>Name</label><input type="text" id="name" placeholder="Your name"></div>
    <div class="input-group"><label>Password</label><input type="password" id="password" placeholder="Min 6 characters"></div>
    <button id="primaryBtn" class="btn primary" onclick="submitAuth()">Sign In</button>
    <button id="secondaryBtn" class="btn ghost" onclick="toggleMode()">New here? Create account</button>
  </div>
</div>

<!-- CHAT SCREEN -->
<div id="chatScreen" class="screen">
  <header class="topbar glass-panel">
    <div class="brand">
      <div class="brand-dot"></div>
      <span>AXIOM</span>
    </div>
    <!-- PROVIDER TOGGLE -->
    <div class="provider-toggle">
      <button id="toggleGroq" class="active" onclick="setProvider('groq')">⚡ Groq</button>
      <button id="toggleGemini" onclick="setProvider('gemini')">🧠 Gemini</button>
    </div>
    <button class="icon-btn logout-btn" onclick="logout()" title="Logout">✕</button>
  </header>

  <main id="messages" class="messages"></main>

  <footer class="composer glass-panel">
    <div class="input-wrapper">
      <!-- FILE UPLOAD -->
      <input type="file" id="fileInput" accept="*/*" style="display: none;" onchange="handleFile(event)">
      <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Attach File">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      
      <textarea id="input" placeholder="Message AXIOM..." rows="1" onkeydown="handleKey(event)" oninput="autosize(this)"></textarea>
    </div>
    
    <button class="send-btn" onclick="handleSend()" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </footer>
  
  <!-- FILE PREVIEW -->
  <div id="filePreview" class="file-preview hidden">
    <span id="fileName">file.pdf</span>
    <button onclick="clearFile()">✕</button>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
